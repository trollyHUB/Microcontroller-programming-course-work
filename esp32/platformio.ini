; PlatformIO Project Configuration
; NEXIS Wellness Station v2.0

[env:esp32dev]
platform     = espressif32
board        = esp32dev
framework    = arduino

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Библиотеки
lib_deps =
    ; ── Основные датчики ─────────────────────────────────
    adafruit/Adafruit BME280 Library @ ^2.2.4      ; T + H + P (основной)
    adafruit/Adafruit Unified Sensor @ ^1.1.14     ; зависимость BME280
    adafruit/DHT sensor library @ ^1.4.6           ; DHT11 (доп.)

    ; ── Прочие датчики ───────────────────────────────────
    claws/BH1750 @ ^1.3.0                          ; освещённость

    ; ── Дисплей ──────────────────────────────────────────
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4       ; LCD 1602 I2C

    ; ── Сеть и JSON ──────────────────────────────────────
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
